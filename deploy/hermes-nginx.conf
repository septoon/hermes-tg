map $http_upgrade $hermes_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=hermes_login:1m rate=10r/m;

server {
    listen 80;
    server_name hermes.lumastack.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://hermes.lumastack.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hermes.lumastack.ru;
    ssl_certificate /etc/letsencrypt/live/hermes.lumastack.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes.lumastack.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 20m;

    location ~ ^/auth/(login|callback)$ {
        limit_req zone=hermes_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/hermes-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/hermes-proxy.conf;
    }
}
